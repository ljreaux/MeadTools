<script>
const canvas=document.querySelector('#canvas'),views=document.querySelector('#view'),search=document.querySelector('#search'),buttons=[...document.querySelectorAll('[data-model]')],status=document.querySelector('#status');
let svg,original,drag=null;
function box(){const b=svg.viewBox.baseVal;return{x:b.x,y:b.y,width:b.width,height:b.height}}
function setBox(b){svg.setAttribute('viewBox',[b.x,b.y,b.width,b.height].join(' '))}
function loadView(){const template=document.querySelector('#view-'+views.value);canvas.replaceChildren(template.content.cloneNode(true));svg=canvas.querySelector('svg');original=box();status.textContent=views.options[views.selectedIndex].textContent+'. Choose a table to inspect it.'}
function zoom(factor,anchor){const b=box(),center=anchor||{x:b.x+b.width/2,y:b.y+b.height/2};if(b.width*factor<40||b.width*factor>original.width*8)return;setBox({x:center.x+(b.x-center.x)*factor,y:center.y+(b.y-center.y)*factor,width:b.width*factor,height:b.height*factor})}
function point(event){return new DOMPoint(event.clientX,event.clientY).matrixTransform(svg.getScreenCTM().inverse())}
function focusTable(name){let node=svg.querySelector('#table_'+name);if(!node||views.value==='overview'){views.value='full';loadView();node=svg.querySelector('#table_'+name)}if(!node)return;const bounds=node.getBBox(),matrix=svg.getScreenCTM().inverse().multiply(node.getScreenCTM()),p1=new DOMPoint(bounds.x,bounds.y).matrixTransform(matrix),p2=new DOMPoint(bounds.x+bounds.width,bounds.y+bounds.height).matrixTransform(matrix);svg.querySelectorAll('.selected').forEach(n=>n.classList.remove('selected'));node.classList.add('selected');setBox({x:p1.x-50,y:p1.y-50,width:p2.x-p1.x+100,height:p2.y-p1.y+100});status.textContent=name+' — columns, keys and connected relationships.'}
views.addEventListener('change',loadView);document.querySelector('#fit').addEventListener('click',()=>{setBox(original);status.textContent='Showing the complete selected view.'});document.querySelector('#zoom-in').addEventListener('click',()=>zoom(.75));document.querySelector('#zoom-out').addEventListener('click',()=>zoom(1.3));
search.addEventListener('input',()=>{const term=search.value.trim().toLowerCase();let count=0;for(const button of buttons){button.hidden=!button.textContent.toLowerCase().includes(term);if(!button.hidden)count++}document.querySelector('#empty').hidden=count>0});search.addEventListener('keydown',e=>{if(e.key==='Enter'){const first=buttons.find(b=>!b.hidden);if(first)focusTable(first.dataset.model)}});buttons.forEach(button=>button.addEventListener('click',()=>focusTable(button.dataset.model)));
canvas.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?.9:1.1,point(e))},{passive:false});canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,box:box(),matrix:svg.getScreenCTM().inverse()};canvas.setPointerCapture(e.pointerId);canvas.classList.add('dragging')});canvas.addEventListener('pointermove',e=>{if(!drag)return;const start=new DOMPoint(drag.x,drag.y).matrixTransform(drag.matrix),now=new DOMPoint(e.clientX,e.clientY).matrixTransform(drag.matrix);setBox({...drag.box,x:drag.box.x+start.x-now.x,y:drag.box.y+start.y-now.y})});for(const event of ['pointerup','pointercancel'])canvas.addEventListener(event,()=>{drag=null;canvas.classList.remove('dragging')});canvas.addEventListener('keydown',e=>{if(e.key==='+'||e.key==='='){e.preventDefault();zoom(.75)}else if(e.key==='-'){e.preventDefault();zoom(1.3)}else if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const b=box();setBox({...b,x:b.x+(e.key==='ArrowLeft'?-.1:e.key==='ArrowRight'?.1:0)*b.width,y:b.y+(e.key==='ArrowUp'?-.1:e.key==='ArrowDown'?.1:0)*b.height})}});
loadView();
</script>
