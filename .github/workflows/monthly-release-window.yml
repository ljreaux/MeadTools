name: Monthly release window

on:
  pull_request:
    branches: [main]
    types:
      [
        opened,
        synchronize,
        reopened,
        edited,
        labeled,
        unlabeled,
        ready_for_review,
        converted_to_draft,
      ]
  pull_request_review:
    types: [submitted, dismissed]
  push:
    branches: [main]
  schedule:
    - cron: "15 9 * * 1"
      timezone: America/Chicago
    - cron: "0 12 * * 1"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: "monthly retry, close expired gate, initial promotion, or hotfix"
        type: choice
        options: [monthly, close, initial, hotfix]
        required: true
      pr_number:
        description: "PR number for initial promotion or hotfix"
        type: number
        required: false
      expected_head_sha:
        description: "Exact approved head SHA for initial promotion or hotfix"
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: Hold or open monthly release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SCHEDULE: ${{ github.event.schedule }}
      RELEASE_MODE: ${{ inputs.mode || 'monthly' }}
      RELEASE_PR_NUMBER: ${{ inputs.pr_number }}
      RELEASE_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
    concurrency:
      group: main-release-gate
      cancel-in-progress: false
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Hold or open gate
        run: node scripts/monthly-release-window.mjs
