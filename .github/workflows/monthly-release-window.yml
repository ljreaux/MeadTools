name: Monthly release window

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]
  schedule:
    - cron: "15 9 * * 1"
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: "monthly retry, initial promotion, or hotfix"
        type: choice
        options: [monthly, initial, hotfix]
        required: true
      pr_number:
        description: "PR number for initial promotion or hotfix"
        type: number
        required: false
      expected_head_sha:
        description: "Exact approved head SHA for initial promotion or hotfix"
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    name: Hold or open monthly release gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_MODE: ${{ inputs.mode || 'monthly' }}
      RELEASE_PR_NUMBER: ${{ inputs.pr_number }}
      RELEASE_EXPECTED_SHA: ${{ inputs.expected_head_sha }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@v4
      - name: Hold or open gate
        run: node scripts/monthly-release-window.mjs
