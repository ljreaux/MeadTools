name: Main release notes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review, converted_to_draft]

permissions:
  contents: read

jobs:
  notes:
    name: Release notes or reviewed bug fix
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check dated notes or bug-only rationale
        run: node scripts/check-pr-release-notes.mjs
