name: Main release notes

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

jobs:
  notes:
    name: Release notes or reviewed bug fix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check dated notes or bug-only rationale
        run: node scripts/check-pr-release-notes.mjs
