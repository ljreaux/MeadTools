name: Synchronize release branches

on:
  push:
    branches:
      - main
      - preview
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synchronize-release-branches
  cancel-in-progress: false

jobs:
  synchronize:
    name: Synchronize reviewed release ancestry
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create branch-sync app token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BRANCH_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.BRANCH_SYNC_APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Safely synchronize branch ancestry
        run: node scripts/sync-release-branches.mjs
