name: Create Preview Builds

on:
  workflow_dispatch: {}
  push:
    branches:
      - preview
    paths:
      - apps/mobile/**
      - packages/**
      - package.json
      - package-lock.json
      - tsconfig.base.json

jobs:
  migration_build_pause:
    name: Check preview build gate
    outputs:
      builds_enabled: ${{ steps.pause_check.outputs.builds_enabled }}
    steps:
      - uses: eas/checkout
      - id: pause_check
        env:
          EAS_EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before || '' }}
        run: |
          set -e
          builds_enabled=$(node ../../scripts/eas-preview-build-gate.mjs)
          echo "Preview builds enabled: $builds_enabled"
          set-output builds_enabled "$builds_enabled"

  quality:
    name: Typecheck mobile app
    needs: [migration_build_pause]
    if: ${{ needs.migration_build_pause.outputs.builds_enabled == 'true' }}
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules
      - run: npm run typecheck
      - run: EXPO_NO_DOTENV=1 EAS_BUILD_PROFILE=preview npx expo install --check

  build_android:
    name: Build Android preview
    needs: [migration_build_pause, quality]
    if: ${{ needs.migration_build_pause.outputs.builds_enabled == 'true' }}
    type: build
    params:
      platform: android
      profile: preview

  build_ios:
    name: Build iOS preview
    needs: [migration_build_pause, quality]
    if: ${{ needs.migration_build_pause.outputs.builds_enabled == 'true' }}
    type: build
    params:
      platform: ios
      profile: preview
